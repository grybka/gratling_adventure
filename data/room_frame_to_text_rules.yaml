default_productions:
  - "START -> \"This \" FEATUREADJ \" \" ROOMNOUN \" has \" FEATUREN \".\""
  - "START -> FEATUREN \" and \" FEATUREN  \".\""
  - "START -> FEATUREN \", \" FEATUREN \" and \" FEATUREN \".\""
  - "ROOMNAME -> FEATUREADJ \" \" ROOMNOUN"
match_productions:
