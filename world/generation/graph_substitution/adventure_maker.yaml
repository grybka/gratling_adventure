substitution_rules:
  - rule_name: "extra_room"
    find_graph: 
      nodes: 
        - id: "$from"
          datapattern: "$from_data"
        - id: "$to"
          datapattern: "$to_data"
      edges:
        - head: "$to"
          tail: "$from"
    replace_graph:
      nodes:
        - id: "$from"
          datapattern: "$from_data"
        - id: "$to"
          datapattern: "$to_data"
        - id: "$new_id"
      edges:
        - tail: "$from"
          head: "$new_id"
        - tail: "$new_id"
          head: "$to"


